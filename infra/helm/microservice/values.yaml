nameOverride: ""

replicaCount: 2

# Which colour the main Service currently points at. The pipeline flips it
# only after end-to-end tests pass against the preview Service.
activeColor: blue

image:
  repository: ""
  pullPolicy: IfNotPresent

# Each colour carries its own tag on purpose: during a rollout the old colour
# must keep serving the previous image while the new one is being verified.
colors:
  blue:
    enabled: true
    tag: ""
  green:
    enabled: false
    tag: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  nodePort: null

probes:
  liveness: /health
  readiness: /ready
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3

metrics:
  enabled: true
  path: /metrics

migrations:
  enabled: false
  tag: ""
  command: []

env: []

envFromSecret: ""

writablePaths: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# runAsUser must be numeric: the kubelet verifies "not root" before the container
# starts and cannot resolve user names baked into the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
