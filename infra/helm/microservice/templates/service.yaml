{{- $name := include "microservice.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    role: active
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ $name }}
    color: {{ .Values.activeColor }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-preview
  labels:
    app: {{ $name }}
    role: preview
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
    color: {{ include "microservice.previewColor" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
