image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

auth:
  database: lab
  username: lab
  existingSecret: lab-secrets
  passwordKey: POSTGRES_PASSWORD

persistence:
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
